  # ─── Docker Compose (image: de los docker-compose.yml) ──────────────────────
  - package-ecosystem: "docker-compose"
    directories:
      - "/docker/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    groups:
      docker-compose:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docker"
